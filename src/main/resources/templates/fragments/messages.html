<div xmlns:th="http://www.thymeleaf.org"
     th:fragment="messages"
     aria-live="polite">

    <div th:if="${successMessage != null}"
         class="alert-success"
         th:text="${successMessage}">
    </div>

    <div th:if="${errorMessage != null}"
         class="alert-error"
         th:text="${errorMessage}">
    </div>

</div>
