
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | Digital Lending</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Borrower CSS -->
    <link rel="stylesheet"
          th:href="@{/css/borrower.css}">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">

    <a class="navbar-brand" th:href="@{/borrower/dashboard}">
        <i class="bi bi-bank2"></i>
        Digital Lending
    </a>

    <span class="text-white">Borrower Portal</span>

</nav>


<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <aside class="col-md-2 sidebar bg-dark text-white p-3">

            <h6 class="text-secondary mb-4">
                MAIN MENU
            </h6>

            <a th:href="@{/borrower/dashboard}"
               class="nav-link">

                <i class="bi bi-speedometer2"></i>
                Dashboard

            </a>

            <a th:href="@{/borrower/profile}"
               class="nav-link">

                <i class="bi bi-person-circle"></i>
                My Profile

            </a>

            <a th:href="@{/borrower/profile/edit}"
               class="nav-link active">

                <i class="bi bi-pencil-square"></i>
                Edit Profile

            </a>

            <a th:href="@{/borrower/loans/apply}"
               class="nav-link">

                <i class="bi bi-file-earmark-plus"></i>
                Apply for Loan

            </a>

            <a th:href="@{/borrower/loans}"
               class="nav-link">

                <i class="bi bi-file-earmark-text"></i>
                My Loans

            </a>


            <!-- Logout -->
            <form th:action="@{/logout}" method="post">

                <button type="submit"
                        class="btn btn-outline-light mt-4 w-100">

                    <i class="bi bi-box-arrow-right"></i>
                    Logout

                </button>

            </form>

        </aside>


        <!-- Main Content -->
        <main class="col-md-10 p-4">

            <h2 class="fw-bold">
                Edit Your Profile
            </h2>

            <p class="text-muted">
                Update your personal and employment information.
            </p>


            <!-- Error Message -->
            <div th:if="${error}"
                 class="alert alert-danger">

                <i class="bi bi-exclamation-circle"></i>

                <span th:text="${error}"></span>

            </div>


            <!-- Edit Form Card -->
            <div class="card shadow-sm mt-4">

                <div class="card-header bg-white p-3">

                    <h5 class="mb-0">

                        <i class="bi bi-person-vcard text-primary"></i>

                        Update Personal Information

                    </h5>

                </div>


                <div class="card-body p-4">

                    <form th:action="@{/borrower/profile/update}"
                          th:object="${profileRequest}"
                          method="post">

                        <!-- CSRF -->
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">


                        <div class="row g-4">

                            <!-- Full Name -->
                            <div class="col-md-6">

                                <label class="form-label">
                                    Full Name
                                    <span class="text-danger">*</span>
                                </label>

                                <input type="text"
                                       th:field="*{fullName}"
                                       class="form-control"
                                       placeholder="Enter full name">

                                <small class="text-danger"
                                       th:errors="*{fullName}">
                                </small>

                            </div>


                            <!-- Phone -->
                            <div class="col-md-6">

                                <label class="form-label">
                                    Phone Number
                                    <span class="text-danger">*</span>
                                </label>

                                <input type="tel"
                                       th:field="*{phone}"
                                       class="form-control"
                                       placeholder="Enter phone number">

                                <small class="text-danger"
                                       th:errors="*{phone}">
                                </small>

                            </div>


                            <!-- DOB -->
                            <div class="col-md-6">

                                <label class="form-label">
                                    Date of Birth
                                </label>

                                <input type="date"
                                       th:field="*{dateOfBirth}"
                                       class="form-control">

                                <small class="text-danger"
                                       th:errors="*{dateOfBirth}">
                                </small>

                            </div>


                            <!-- Employment -->
                            <div class="col-md-6">

                                <label class="form-label">
                                    Employment Type
                                    <span class="text-danger">*</span>
                                </label>

                                <select th:field="*{employmentType}"
                                        class="form-select">

                                    <option value="">
                                        Select Employment Type
                                    </option>

                                    <option value="SALARIED">
                                        Salaried
                                    </option>

                                    <option value="SELF_EMPLOYED">
                                        Self Employed
                                    </option>

                                    <option value="BUSINESS">
                                        Business
                                    </option>

                                    <option value="STUDENT">
                                        Student
                                    </option>

                                </select>

                                <small class="text-danger"
                                       th:errors="*{employmentType}">
                                </small>

                            </div>


                            <!-- Address -->
                            <div class="col-12">

                                <label class="form-label">
                                    Address
                                    <span class="text-danger">*</span>
                                </label>

                                <textarea th:field="*{address}"
                                          class="form-control"
                                          rows="3"
                                          placeholder="Enter your address">
                                </textarea>

                                <small class="text-danger"
                                       th:errors="*{address}">
                                </small>

                            </div>


                            <!-- Monthly Income -->
                            <div class="col-md-6">

                                <label class="form-label">
                                    Monthly Income (₹)
                                    <span class="text-danger">*</span>
                                </label>

                                <input type="number"
                                       th:field="*{monthlyIncome}"
                                       class="form-control"
                                       min="0"
                                       step="0.01"
                                       placeholder="Enter monthly income">

                                <small class="text-danger"
                                       th:errors="*{monthlyIncome}">
                                </small>

                            </div>

                        </div>


                        <!-- Buttons -->
                        <div class="mt-4 d-flex gap-3">

                            <button type="submit"
                                    class="btn btn-primary">

                                <i class="bi bi-check-circle"></i>
                                Update Profile

                            </button>

                            <a th:href="@{/borrower/profile}"
                               class="btn btn-outline-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>


            <footer class="text-center text-muted mt-5 mb-3">

                Digital Lending &middot; Borrower Portal

            </footer>

        </main>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
