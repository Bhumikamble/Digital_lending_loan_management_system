
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | DigitalLend</title>
    <link rel="stylesheet" th:href="@{/css/borrower.css}">
</head>

<body>

<div class="app-layout">

    <div th:replace="~{borrower/fragments/sidebar :: sidebar('profile')}"></div>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h2>My Borrower Profile</h2>
                <p>Manage your personal and employment information.</p>
            </div>
            <span class="user-info" th:text="${userEmail}">Email</span>
        </header>

        <div class="content-card form-card">

            <div class="section-heading">
                <div>
                    <h3>Personal Information</h3>
                    <p>Keep your information accurate and up to date.</p>
                </div>
                <span class="status approved"
                      th:if="${profileCompleted}">Profile Created</span>
                <span class="status applied"
                      th:unless="${profileCompleted}">New Profile</span>
            </div>

            <div class="alert alert-success"
                 th:if="${successMessage}"
                 th:text="${successMessage}"></div>

            <div class="alert alert-danger"
                 th:if="${errorMessage}"
                 th:text="${errorMessage}"></div>

            <form th:action="@{/borrower/profile}"
                  th:object="${profileRequest}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text"
                               th:field="*{fullName}"
                               placeholder="Enter your full name">
                        <small class="field-error"
                               th:errors="*{fullName}"></small>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email"
                               th:value="${userEmail}"
                               readonly>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel"
                               th:field="*{phone}"
                               placeholder="Enter phone number">
                        <small class="field-error"
                               th:errors="*{phone}"></small>
                    </div>

                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date"
                               th:field="*{dateOfBirth}">
                        <small class="field-error"
                               th:errors="*{dateOfBirth}"></small>
                    </div>

                    <div class="form-group full-width">
                        <label>Residential Address</label>
                        <textarea th:field="*{address}"
                                  rows="3"
                                  placeholder="Enter your full address"></textarea>
                        <small class="field-error"
                               th:errors="*{address}"></small>
                    </div>

                    <div class="form-group">
                        <label>Employment Type</label>
                        <select th:field="*{employmentType}">
                            <option value="">Select employment type</option>
                            <option value="SALARIED">Salaried</option>
                            <option value="SELF_EMPLOYED">Self Employed</option>
                            <option value="BUSINESS">Business</option>
                            <option value="OTHER">Other</option>
                        </select>
                        <small class="field-error"
                               th:errors="*{employmentType}"></small>
                    </div>

                    <div class="form-group">
                        <label>Monthly Income (₹)</label>
                        <input type="number"
                               th:field="*{monthlyIncome}"
                               min="0"
                               step="0.01"
                               placeholder="Enter monthly income">
                        <small class="field-error"
                               th:errors="*{monthlyIncome}"></small>
                    </div>

                </div>

                <div class="form-actions">
                    <button type="submit" class="primary-button">
                        Save Profile
                    </button>
                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
