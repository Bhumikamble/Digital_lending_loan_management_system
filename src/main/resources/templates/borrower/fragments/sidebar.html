
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar(activePage)" class="sidebar">

    <div class="brand">
        <span class="brand-icon">D</span>
        <div>
            <h2>DigitalLend</h2>
            <small>Borrower Portal</small>
        </div>
    </div>

    <div class="sidebar-label">MAIN MENU</div>

    <nav class="sidebar-nav">

        <a th:href="@{/borrower/dashboard}"
           th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
            Dashboard
        </a>

        <a th:href="@{/borrower/profile}"
           th:classappend="${activePage == 'profile'} ? ' active' : ''">
            My Profile
        </a>

        <a th:href="@{/borrower/apply-loan}"
           th:classappend="${activePage == 'apply'} ? ' active' : ''">
            Apply for Loan
        </a>

        <a th:href="@{/borrower/my-loans}"
           th:classappend="${activePage == 'loans'} ? ' active' : ''">
            My Loans
        </a>

        <!-- EMI & Repayment Dropdown -->
        <details class="sidebar-dropdown"
                 th:open="${activePage == 'emi' or activePage == 'schedule' or activePage == 'history'}">

            <summary class="sidebar-dropdown-title">
                EMI &amp; Repayment
                <span class="dropdown-arrow">⌄</span>
            </summary>

            <div class="sidebar-submenu">

                <a th:href="@{/repayments/emi}"
                   th:classappend="${activePage == 'emi'} ? ' active' : ''">
                    EMI Calculator
                </a>

                <a th:href="@{/repayments/schedule}"
                   th:classappend="${activePage == 'schedule'} ? ' active' : ''">
                    Repayment Schedule
                </a>

                <a th:href="@{/repayments/history}"
                   th:classappend="${activePage == 'history'} ? ' active' : ''">
                    Repayment History
                </a>

            </div>
        </details>

    </nav>

    <div class="sidebar-bottom">
        <form th:action="@{/logout}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit" class="logout-button">
                Logout
            </button>
        </form>
    </div>

</aside>

</body>
</html>
